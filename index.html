<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0"/>
<meta name="theme-color" content="#1a5276"/>
<title>Disponibilidad de Medicamentos — CSS Panamá</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="apple-touch-icon" href="icons/icon-192.png"/>
<link rel="icon" href="favicon.ico"/>
<style>
:root{
  --azul:#1a5276; --azul2:#2874a6; --azul-cl:#d4e6f1;
  --bg:#ececec; --card:#ffffff; --bd:#a8a8a8; --bd2:#cfcfcf;
  --txt:#1c2733; --mut:#5b6b7a;
  --verde:#1e8449; --verde-cl:#d4efdf;
  --amar:#b7950b; --amar-cl:#fcf3cf;
  --rojo:#a93226; --rojo-cl:#f5d5d0;
  --mono:'Consolas','Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--txt);font-size:13px;line-height:1.4}
.wrap{max-width:1400px;margin:0 auto;padding:8px}

/* HEADER */
.hdr{background:var(--azul);color:#fff;padding:10px 16px;border:1px solid #154360;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hdr h1{font-size:17px;font-weight:700;letter-spacing:.2px}
.hdr .sub{font-size:11px;color:#bcd6ea;font-family:var(--mono)}
.hdr .inst-badge{margin-left:auto;font-size:10px;background:#154360;padding:4px 10px;border:1px solid #2874a6;border-radius:2px}
#logoCss{height:46px;width:46px;border-radius:50%;background:#fff;padding:2px;object-fit:contain;flex-shrink:0}

/* BANDA DE PROVINCIAS */
.prov-band{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px;margin-top:8px}
.prov-card{background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--bd);padding:8px 10px;cursor:pointer;transition:background .12s}
.prov-card:hover{background:#f0f6fb}
.prov-card.on{background:#eaf3fb;border-top-color:var(--azul)}
.prov-card .pn{font-size:11px;font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prov-card .pd{font-family:var(--mono);font-size:19px;font-weight:700;margin-top:3px}
.prov-card .pl{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.3px}
.prov-card .pbar{height:4px;background:#e4e4e4;border-radius:2px;margin-top:5px;overflow:hidden}
.prov-card .pbar i{display:block;height:100%}

/* INSTALL PWA BTN */
.install-btn{background:#16a085;color:#fff;border:none;font-weight:700;font-size:11px;padding:7px 14px;cursor:pointer;border-radius:3px;display:none;white-space:nowrap}
.install-btn:hover{background:#138a72}

/* MAPA */
.map-card{background:var(--card);border:1px solid var(--bd);margin-top:8px}
.map-head{background:#f4f7fa;border-bottom:1px solid var(--bd);padding:7px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.map-head .ttl{font-weight:700;font-size:13px;color:var(--azul)}
.map-head .lg{font-size:10px;color:var(--mut);display:flex;align-items:center;gap:4px;margin-left:6px}
.map-head .lg .dot{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid #00000022}
#map{height:340px;width:100%;background:#aadaff;z-index:1}
.map-stats{display:flex;gap:0;border-top:1px solid var(--bd);background:#fafafa;flex-wrap:wrap}
.map-stats .st{flex:1;min-width:120px;padding:8px 12px;border-right:1px solid var(--bd2);text-align:center}
.map-stats .st .v{font-family:var(--mono);font-size:20px;font-weight:700}
.map-stats .st .l{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}

/* FILTROS */
.filters{background:var(--card);border:1px solid var(--bd);border-top:none;padding:10px 12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters input,.filters select{font-family:'Segoe UI',sans-serif;font-size:13px;padding:7px 10px;border:1px solid var(--bd);border-radius:2px;background:#fff}
.filters input{flex:1;min-width:200px}
.filters .cnt{font-size:11px;color:var(--mut);font-family:var(--mono)}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:2px;overflow:hidden}
.seg button{border:none;background:#fff;padding:7px 12px;font-size:11px;font-weight:600;cursor:pointer;color:var(--mut);border-right:1px solid var(--bd2)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--azul);color:#fff}

/* TABLA */
.tbl-card{background:var(--card);border:1px solid var(--bd);border-top:none;margin-bottom:8px}
.scroll{max-height:62vh;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{position:sticky;top:0;background:var(--azul);color:#fff;font-size:10px;text-transform:uppercase;letter-spacing:.3px;padding:8px 10px;text-align:left;cursor:pointer;white-space:nowrap;z-index:2}
thead th.nosort{cursor:default}
thead th.num{text-align:right}
/* col 1 (+), col 2 nombre (libre), col 3 días, col 4 %inst, col 5 score, col 6 instalac */
col.c-exp{width:34px} col.c-dias{width:120px} col.c-pct{width:72px} col.c-score{width:90px} col.c-inst{width:86px}
tbody td{padding:8px 10px;border-bottom:1px solid #eee;vertical-align:middle}
tbody td.num{text-align:right;font-family:var(--mono)}
tbody td.c1{text-align:center}
tbody tr.med:hover{background:#f0f6fb;cursor:pointer}
.medname{font-weight:600;font-size:12.5px;line-height:1.3}
.medsub{font-size:10px;color:var(--mut);font-family:var(--mono);margin-top:2px}
.exp-ind{font-family:var(--mono);font-weight:700;color:var(--azul2);font-size:15px}

/* ===== MÓVIL: tabla -> tarjetas ===== */
@media(max-width:680px){
  thead.main-head{display:none}
  table,tbody,tr.med,td{display:block;width:100%}
  tr.med{border-bottom:none;border:1px solid var(--bd2);margin-bottom:6px;padding:8px 10px;position:relative}
  tr.med td{border:none;padding:2px 0;text-align:left!important}
  tr.med td.c1{position:absolute;top:8px;right:8px;width:auto}
  /* etiquetas para celdas numéricas en móvil */
  tr.med td.cell-dias::before{content:'Días cobertura: ';font-size:10px;color:var(--mut);text-transform:uppercase}
  tr.med td.cell-pct::before{content:'% Inst.: ';font-size:10px;color:var(--mut);text-transform:uppercase}
  tr.med td.cell-score::before{content:'Score salud: ';font-size:10px;color:var(--mut);text-transform:uppercase}
  tr.med td.cell-inst::before{content:'Instalaciones: ';font-size:10px;color:var(--mut);text-transform:uppercase}
  tr.med td.num{font-family:inherit}
  tr.med td.num .dias,tr.med td.num .sc{font-family:var(--mono)}
  tr.exprow td{padding:0}
}

/* badges */
.clase{display:inline-block;background:#37474f;color:#fff;font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 6px;border-radius:2px;cursor:help;vertical-align:middle}
.clase:hover{background:var(--azul2)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(20,30,40,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border:1px solid var(--bd);max-width:440px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.modal-h{background:var(--azul);color:#fff;padding:10px 14px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.modal-x{margin-left:auto;cursor:pointer;font-size:15px;opacity:.85}
.modal-x:hover{opacity:1}
.modal-b{padding:14px;font-size:12.5px;line-height:1.5}
.modal-b p{margin-bottom:8px}
.cl-row{background:#f4f7fa;border-left:3px solid var(--azul2);padding:7px 10px;margin-bottom:7px}
.cl-row b{color:var(--azul)}
.cl-row div{font-size:12px;color:var(--txt);margin-top:2px}
.cl-data{font-family:var(--mono);font-size:11px;color:var(--azul);background:#fff;border:1px solid var(--bd2);padding:4px 7px;margin-top:5px!important;border-radius:2px}
.cl-note{background:var(--azul-cl);border:1px solid #aacbe2;padding:8px 10px;font-size:11.5px;border-radius:2px}
.imp{font-size:10px;font-weight:700}
.imp.v{color:var(--rojo)}.imp.e{color:var(--amar)}.imp.s{color:#999}

/* dias chip */
.dias{font-family:var(--mono);font-weight:700;padding:3px 8px;border-radius:2px;font-size:12px;display:inline-block;min-width:54px;text-align:center}
.dias.ok{background:var(--verde-cl);color:var(--verde)}
.dias.med{background:var(--amar-cl);color:var(--amar)}
.dias.bajo{background:var(--rojo-cl);color:var(--rojo)}
.dias.cero{background:#5b2c25;color:#fff}
.dias.sc{background:#eceff1;color:#5b6b7a;font-style:italic;font-weight:600}
.dias.nd{background:#f4f4f4;color:#aaa}

/* score chip */
.sc{font-family:var(--mono);font-weight:700;font-size:13px}

/* expand row */
.exprow td{background:#f4f7fa;border-left:3px solid var(--azul2);padding:0}
.expinner{padding:10px}
.exptabs{display:flex;gap:2px;margin-bottom:8px;flex-wrap:wrap}
.exptab{padding:5px 11px;font-size:11px;font-weight:600;cursor:pointer;background:#e4e9ee;border:1px solid var(--bd2);color:var(--mut)}
.exptab.on{background:#fff;color:var(--azul);border-bottom-color:#fff}
.expbody table{font-size:11px}
.expbody thead th{position:static;background:#37474f}
.note{background:var(--azul-cl);border:1px solid #aacbe2;padding:8px 11px;font-size:11px;margin-bottom:8px;border-radius:2px}
.note.amar{background:var(--amar-cl);border-color:#e8d48a}
.comp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:8px}
.compc{background:#fff;border:1px solid var(--bd2);padding:8px;text-align:center}
.compc .cl{font-size:9px;color:var(--mut);text-transform:uppercase}
.compc .cv{font-family:var(--mono);font-size:18px;font-weight:700;margin-top:3px}
.formula{font-family:var(--mono);font-size:10px;background:#2b3a48;color:#d6e9f5;padding:7px 9px;border-radius:2px;margin:6px 0;white-space:pre-wrap;line-height:1.5}

/* leaflet marker labels */
.inst-lbl{font-family:var(--mono);font-size:10px;font-weight:700;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;pointer-events:none}

@media(max-width:640px){
  #map{height:260px}
  .hdr h1{font-size:14px}
  .map-stats .st .v{font-size:16px}
  thead th,tbody td{padding:6px 5px;font-size:11px}
  .filters input{min-width:140px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <img id="logoCss" src="icons/icon-192.png" alt="CSS Panamá" onerror="this.style.display='none'"/>
    <div>
      <h1>Disponibilidad de Medicamentos</h1>
      <div class="sub" id="hsub">Caja de Seguro Social · Panamá</div>
    </div>
    <div class="inst-badge" id="instBadge">—</div>
    <button class="install-btn" id="installBtn">⤓ Instalar app</button>
  </div>

  <!-- BANDA DE PROVINCIAS -->
  <div class="prov-band" id="provBand"></div>

  <!-- MAPA TERMOGRÁFICO -->
  <div class="map-card">
    <div class="map-head">
      <span class="ttl">🗺️ Termografía de abastecimiento</span>
      <span id="mapScopeLbl" style="font-size:11px;color:var(--mut);font-style:italic"></span>
      <div style="flex:1"></div>
      <span style="font-size:10px;color:var(--mut);margin-right:2px">Nivel de abastecimiento:</span>
      <span class="lg"><span class="dot" style="background:#a93226"></span>Crítico &lt;30d</span>
      <span class="lg"><span class="dot" style="background:#b7950b"></span>Bajo &lt;90d</span>
      <span class="lg"><span class="dot" style="background:#27ae60"></span>Óptimo ≥90d</span>
    </div>
    <div id="map"></div>
    <div class="map-stats" id="mapStats"></div>
  </div>

  <!-- FILTROS -->
  <div class="filters">
    <input type="text" id="q" placeholder="🔍 Buscar medicamento (ej. amlodipina)…" oninput="onSearch(this.value)"/>
    <select id="provSel" onchange="onProv(this.value)"><option value="">Todo el país</option></select>
    <select id="tipoSel" onchange="onTipo(this.value)"><option value="">Todo tipo de unidad</option></select>
    <div class="seg" id="impSeg">
      <button data-imp="" onclick="onImp('')">Todos</button>
      <button class="on" data-imp="VITAL" onclick="onImp('VITAL')">Prioritarios</button>
    </div>
    <span class="cnt" id="cnt"></span>
  </div>

  <!-- TABLA -->
  <div class="tbl-card">
    <div class="scroll">
      <table>
        <colgroup><col class="c-exp"/><col/><col class="c-dias"/><col class="c-pct"/><col class="c-score"/><col class="c-inst"/></colgroup>
        <thead class="main-head"><tr>
          <th class="nosort"></th>
          <th onclick="sortBy('sum')">Medicamento</th>
          <th class="num" onclick="sortBy('dias')">Días cobertura</th>
          <th class="num" onclick="sortBy('su')">% Inst.</th>
          <th class="num" onclick="sortBy('salud')">Score salud</th>
          <th class="num" onclick="sortBy('nstock')">Instalac.</th>
        </tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </div>
</div>


</script>
<script>
let D, m;  // se cargan desde data.json
const f = n => (n==null?'-':Number(n).toLocaleString('es-PA'));
let OPT = 90; // óptimo de días; se reasigna desde m.optimo_dias al cargar

// ---- estado ----
let st = { q:'', prov:'', tipo:'', imp:'VITAL', sort:{k:'salud',d:-1}, expand:null, expTab:'mapa', skuSel:null };

// ---- helpers de días/color ----
// días: null=sin existencia · 9999=tiene stock pero sin consumo registrado · número=días reales
function diasClass(d){ if(d==null)return 'nd'; if(d>=9999)return 'ok'; if(d===0)return 'cero'; if(d<30)return 'bajo'; if(d<OPT)return 'med'; return 'ok'; }
function diasColor(d){ if(d==null)return '#b0b0b0'; if(d>=9999)return '#27ae60'; if(d===0)return '#5b2c25'; if(d<30)return '#a93226'; if(d<OPT)return '#b7950b'; return '#27ae60'; }
function diasLabel(d){ if(d==null)return 'sin existencia'; if(d>=9999)return '+365 días'; return d+' días'; }
function diasShort(d){ if(d==null)return '—'; if(d>=9999)return '+365d'; return d+'d'; }
function scColor(s){ return s<40?'#a93226':s<60?'#b7950b':s<85?'#2874a6':'#1e8449'; }

// ============ BANDA DE PROVINCIAS ============
// Muestra días medianos por provincia a nivel GENERAL (todos los renglones del segmento),
// independiente del renglón que se expanda — funciona como cabecera de contexto estable.
function provStats(){
  const skus = D.sku.filter(s=>!st.imp||s.imp===st.imp).map(s=>s.sku);
  const byProv={};
  for(const sku of skus){ (D.det[sku]||[]).forEach(d=>{ if(!d.prov)return; if(st.tipo&&d.tipo!==st.tipo)return;
    (byProv[d.prov]=byProv[d.prov]||{arr:[],ues:new Set()});
    byProv[d.prov].ues.add(d.ue);
    if(d.dias!=null && d.dias<9999) byProv[d.prov].arr.push(d.dias); }); }
  const out=[];
  for(const p of D.provincias){ const o=byProv[p]; if(!o)continue;
    const a=o.arr.slice().sort((x,y)=>x-y); const med=a.length?a[Math.floor(a.length/2)]:null;
    out.push({prov:p,med,n:o.ues.size}); }
  return out;
}
function drawProvBand(){
  const stats=provStats();
  const el=document.getElementById('provBand');
  const all=`<div class="prov-card ${st.prov===''?'on':''}" onclick="pickProv('')">
    <div class="pn">Todo el país</div>
    <div class="pd" style="color:var(--azul)">${Object.keys(D.inst).length}</div>
    <div class="pl">instalaciones</div></div>`;
  el.innerHTML = all + stats.map(s=>{
    const col=diasColor(s.med); const pct=s.med==null?0:Math.min(100,s.med/OPT*100);
    return `<div class="prov-card ${st.prov===s.prov?'on':''}" style="border-top-color:${st.prov===s.prov?col:'var(--bd)'}" onclick="pickProv('${s.prov}')">
      <div class="pn" title="${s.prov}">${s.prov}</div>
      <div class="pd" style="color:${col}">${s.med==null?'—':s.med}<span style="font-size:10px;color:var(--mut)"> d</span></div>
      <div class="pl">${s.n} instalac.</div>
      <div class="pbar"><i style="width:${pct}%;background:${col}"></i></div></div>`;
  }).join('');
}
function pickProv(p){ st.prov=p; document.getElementById('provSel').value=p; st.expand=null; st.skuSel=null; render(); updateMap(); drawProvBand(); }

// ============ MODAL CLASE (ABC-XYZ) ============
function showClase(sku){
  const s=D.sku.find(x=>x.sku===sku); if(!s)return;
  const cl=s.clase, a=cl[0], x=cl[1];
  const A={A:'Alta rotación',B:'Rotación media',C:'Baja rotación'};
  const Adesc={A:'concentra parte del 80% superior del consumo nacional',B:'está en el siguiente 15% del consumo',C:'está en el 5% de menor consumo'};
  const X={X:'Demanda estable',Y:'Demanda variable',Z:'Demanda irregular'};
  const Xdesc={X:'predecible, fácil de planificar (variación ≤75%)',Y:'planificación moderada (variación 75–150%)',Z:'esporádica o difícil de prever (variación >150% o pocos puntos de consumo)'};
  const cvPct=Math.round((s.cv||0)*100);
  const html=`<div class="modal-bg" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()">
    <div class="modal-h">Clasificación <span class="clase" style="font-size:14px">${cl}</span><span class="modal-x" onclick="closeModal()">✕</span></div>
    <div class="modal-b">
      <p style="font-weight:600;color:var(--txt)">${s.sum}</p>
      <p>La clase combina dos análisis estándar de inventario, calculados con el consumo real de este renglón:</p>
      <div class="cl-row"><b>${a} — ${A[a]} (ABC por volumen)</b>
        <div>Este renglón ${Adesc[a]}.</div>
        <div class="cl-data">Consumo mensual nacional: <b>${f(s.consmes)}</b> unidades · representa el <b>${s.pctcons}%</b> del consumo total.</div></div>
      <div class="cl-row"><b>${x} — ${X[x]} (XYZ por variabilidad)</b>
        <div>Demanda ${Xdesc[x]}.</div>
        <div class="cl-data">Variabilidad entre instalaciones: <b>${cvPct}%</b> · se consume en <b>${s.nuec}</b> instalaciones.</div></div>
      <p class="cl-note"><b>Lectura:</b> un <b>AX</b> es lo más crítico de gestionar (mucho consumo, muy predecible: no debe faltar nunca). Un <b>CZ</b> es de bajo consumo e irregular (se maneja bajo pedido). Este renglón es <b>${cl}</b>.</p>
    </div></div></div>`;
  let m=document.getElementById('modalHost'); if(!m){m=document.createElement('div');m.id='modalHost';document.body.appendChild(m);} m.innerHTML=html;
}
function closeModal(){ const m=document.getElementById('modalHost'); if(m)m.innerHTML=''; }

// ============ MAPA ============
let map, heatLayer, heatGood, markerLayer;
function initMap(){
  map = L.map('map',{zoomControl:true,scrollWheelZoom:true}).setView([8.7,-80.2],7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
  markerLayer = L.layerGroup().addTo(map);
  updateMap();
}
// Devuelve [{ue,lat,lng,prov,dias,extra}] según el alcance actual (renglón seleccionado o agregado nacional)
function mapPoints(){
  const pts=[];
  const tipoOk = d => (!st.tipo || d.tipo===st.tipo);
  if(st.skuSel){
    const det = D.det[st.skuSel]||[];
    det.forEach(d=>{ if(d.lat!=null && (!st.prov||d.prov===st.prov) && tipoOk(d)) pts.push({ue:d.ue,lat:d.lat,lng:d.lng,prov:d.prov,dias:d.dias,saldo:d.saldo,tipo:d.tipo}); });
  } else {
    const skus = D.sku.filter(s=>!st.imp||s.imp===st.imp).map(s=>s.sku);
    const agg={};
    for(const sku of skus){ (D.det[sku]||[]).forEach(d=>{ if(d.lat==null)return; if(st.prov&&d.prov!==st.prov)return; if(st.tipo&&d.tipo!==st.tipo)return;
      if(!agg[d.ue])agg[d.ue]={ue:d.ue,lat:d.lat,lng:d.lng,prov:d.prov,tipo:d.tipo,arr:[]};
      // contar solo días reales (excluir sin-existencia null y abastecido-sin-consumo 9999 para la mediana)
      if(d.dias!=null && d.dias<9999) agg[d.ue].arr.push(d.dias); }); }
    Object.values(agg).forEach(o=>{ const a=o.arr.slice().sort((x,y)=>x-y); const med=a.length?(a.length%2?a[(a.length-1)/2]:Math.round((a[a.length/2-1]+a[a.length/2])/2)):null;
      pts.push({ue:o.ue,lat:o.lat,lng:o.lng,prov:o.prov,tipo:o.tipo,dias:med,n:o.arr.length}); });
  }
  return pts;
}
function updateMap(){
  const pts = mapPoints();
  markerLayer.clearLayers();
  if(heatLayer){ map.removeLayer(heatLayer); heatLayer=null; }
  if(heatGood){ map.removeLayer(heatGood); heatGood=null; }
  // DOS CAPAS DE CALOR que obedecen la MISMA narrativa que los puntos:
  //   verde = bien abastecido (≥90 días)  ·  rojo = desabastecido (pocos días)
  // Se separan por signo para que el color no dependa de la densidad sino del nivel.
  // Días reales y "con stock sin consumo" (9999, equivale a +365d) tiñen el mapa; sin-existencia (null) se excluye.
  const conD = pts.filter(p=>p.dias!=null);
  const valOf = d => (d>=9999 ? OPT*1.2 : d);
  const heatMal = conD.filter(p=>valOf(p.dias) < OPT).map(p=>{
    const falta = 1 - Math.min(valOf(p.dias),OPT)/OPT;
    return [p.lat,p.lng, Math.max(0.12,falta)];
  });
  const heatBien = conD.filter(p=>valOf(p.dias) >= OPT*0.6).map(p=>{
    const bien = Math.min(1,(valOf(p.dias)-OPT*0.6)/(OPT*0.4));
    return [p.lat,p.lng, Math.max(0.12,bien)];
  });
  if(heatBien.length){
    heatGood = L.heatLayer(heatBien,{radius:40,blur:30,maxZoom:11,minOpacity:.25,max:1.0,
      gradient:{0.0:'rgba(39,174,96,0)',0.4:'#7dcea0',0.7:'#52be80',1.0:'#1e8449'}}).addTo(map);
  }
  if(heatMal.length){
    heatLayer = L.heatLayer(heatMal,{radius:40,blur:30,maxZoom:11,minOpacity:.30,max:1.0,
      gradient:{0.0:'rgba(169,50,38,0)',0.4:'#f4d03f',0.7:'#e67e22',1.0:'#a93226'}}).addTo(map);
  }
  pts.forEach(p=>{
    const col=diasColor(p.dias);
    const mk=L.circleMarker([p.lat,p.lng],{radius:8,fillColor:col,color:'#fff',weight:1.5,fillOpacity:.95});
    mk.bindPopup(`<b>${p.ue}</b><br>${p.prov||''}${p.tipo?' · '+p.tipo:''}<br><b style="color:${col}">${diasLabel(p.dias)}</b>${(p.dias!=null&&p.dias<9999)?' de cobertura':''}${st.skuSel?`<br>Existencia: ${f(p.saldo)}`:`<br>${p.n||0} renglones con consumo`}`);
    markerLayer.addLayer(mk);
  });
  if(pts.length){
    const ll=pts.map(p=>[p.lat,p.lng]);
    try{ map.fitBounds(ll,{padding:[40,40],maxZoom: st.prov?11:9}); }catch(e){}
  }
  drawMapStats(pts);
  const scope = st.skuSel ? `Renglón: ${(D.sku.find(s=>s.sku===st.skuSel)||{}).sum||''}` : (st.imp?`${st.imp==='VITAL'?'Prioritarios':'Esenciales'}`:'Todos los medicamentos');
  document.getElementById('mapScopeLbl').textContent = `— ${scope}${st.prov?' · '+st.prov:''}${st.tipo?' · '+st.tipo:''} · ${pts.length} instalaciones`;
}
function drawMapStats(pts){
  const con = pts.filter(p=>p.dias!=null);
  const reales = con.filter(p=>p.dias<9999).map(p=>p.dias).sort((a,b)=>a-b); // mediana solo con días reales
  const med = reales.length? reales[Math.floor(reales.length/2)] : null;
  const optn = con.filter(p=>p.dias>=OPT).length; // incluye +365d
  const crit = con.filter(p=>p.dias<30).length;
  const bajo = con.filter(p=>p.dias>=30 && p.dias<OPT).length;
  const cero = con.filter(p=>p.dias===0).length;
  document.getElementById('mapStats').innerHTML=`
    <div class="st"><div class="v" style="color:${diasColor(med)}">${med==null?'-':med}</div><div class="l">Días cobertura (mediana)</div></div>
    <div class="st"><div class="v" style="color:#1e8449">${optn}</div><div class="l">Óptimas ≥${OPT} días</div></div>
    <div class="st"><div class="v" style="color:#b7950b">${bajo}</div><div class="l">Bajo óptimo (30–89 d)</div></div>
    <div class="st"><div class="v" style="color:#a93226">${crit}</div><div class="l">Críticas &lt;30 días</div></div>
    <div class="st"><div class="v" style="color:#5b2c25">${cero}</div><div class="l">Sin existencia (0 d)</div></div>`;
}

// ============ TABLA ============
function nStock(s){ return (D.det[s.sku]||[]).filter(d=>d.saldo>0 && (!st.prov||d.prov===st.prov) && (!st.tipo||d.tipo===st.tipo)).length; }
function filtered(){
  let rows = D.sku.filter(s=> (!st.q||s.sum.toLowerCase().includes(st.q)||s.sku.includes(st.q)) && (!st.imp||s.imp===st.imp) );
  rows.forEach(s=>{ s._n=nStock(s); });
  const k=st.sort.k, d=st.sort.d;
  rows.sort((a,b)=>{
    // los prioritarios (faro) aparecen primero, como pide el director — sin etiqueta visible
    if(a.faro!==b.faro) return b.faro-a.faro;
    let va,vb;
    if(k==='sum'){va=a.sum;vb=b.sum;return d*va.localeCompare(vb);}
    if(k==='nstock'){va=a._n;vb=b._n;}
    else{va=a[k]==null?-1:a[k]; vb=b[k]==null?-1:b[k];}
    return d*(va-vb);
  });
  return rows;
}
function render(){
  const rows=filtered();
  document.getElementById('cnt').textContent=`${Math.min(rows.length,400)} de ${rows.length} medicamentos`;
  const tb=document.getElementById('tb');
  tb.innerHTML=rows.slice(0,400).map(s=>{
    let row=`<tr class="med" onclick="toggle('${s.sku}')">
      <td class="c1"><span class="exp-ind">${st.expand===s.sku?'−':'+'}</span></td>
      <td><div class="medname">${s.sum} <span class="clase" onclick="event.stopPropagation();showClase('${s.sku}')" title="Ver clasificación">${s.clase}</span></div><div class="medsub">Renglón ${s.sku}${s.grupo!=='—'?' · '+s.grupo:''}</div></td>
      <td class="num cell-dias"><span class="dias ${diasClass(s.dias)}">${diasLabel(s.dias)}</span></td>
      <td class="num cell-pct" style="color:var(--mut)">${s.su==null?'-':s.su+'%'}</td>
      <td class="num cell-score"><span class="sc" style="color:${scColor(s.salud)}">${s.salud}</span></td>
      <td class="num cell-inst">${s._n}</td></tr>`;
    if(st.expand===s.sku) row+=`<tr class="exprow"><td colspan="6"><div class="expinner">${expandHtml(s)}</div></td></tr>`;
    return row;
  }).join('');
}
function toggle(sku){
  if(st.expand===sku){ st.expand=null; st.skuSel=null; }
  else { st.expand=sku; st.skuSel=sku; st.expTab='mapa'; }
  render(); updateMap();
}

// ============ EXPAND (sub-pestañas, sin modal) ============
function expandHtml(s){
  const tabs=[['mapa','Mapa de este renglón'],['ue','Dónde hay existencia'],['cedis','En bodega central']];
  return `<div class="exptabs">${tabs.map(t=>`<span class="exptab ${st.expTab===t[0]?'on':''}" onclick="event.stopPropagation();st.expTab='${t[0]}';render();">${t[1]}</span>`).join('')}</div>
    <div class="expbody" onclick="event.stopPropagation()">${expInner(s)}</div>`;
}
function expInner(s){
  if(st.expTab==='mapa'){
    return `<div class="note">El mapa de arriba ahora muestra <b>${s.sum}</b>: cada instalación coloreada por sus días de cobertura de este renglón. Use el filtro de provincia para acercarse a una zona.</div>
      <div class="comp">
        <div class="compc"><div class="cl">Días cobertura (nacional)</div><div class="cv" style="color:${diasColor(s.dias)}">${diasLabel(s.dias)}</div></div>
        <div class="compc"><div class="cl">Score salud</div><div class="cv" style="color:${scColor(s.salud)}">${s.salud}</div></div>
        <div class="compc"><div class="cl">% institucional</div><div class="cv" style="color:var(--mut)">${s.su==null?'-':s.su+'%'}</div></div>
        <div class="compc"><div class="cl">Instalaciones con stock</div><div class="cv">${nStock(s)}</div></div></div>`;
  }

  if(st.expTab==='cedis'){
    return `<div class="note amar">El inventario en bodega central (CEDIS) <b>no</b> cuenta para los días de cobertura del paciente: aún no ha llegado a las instalaciones. Aquí está como referencia de lo que está en camino.</div>
      <div class="comp"><div class="compc"><div class="cl">En bodega central</div><div class="cv" style="color:var(--mut)">${f(s.stockced)}</div><div style="font-size:9px;color:#666">${s.mesesced==null?'-':s.mesesced+' meses'}</div></div>
      <div class="compc"><div class="cl">En instalaciones</div><div class="cv">${f(s.stockue)}</div></div></div>`;
  }
  // ue
  const det=(D.det[s.sku]||[]).filter(d=>d.saldo>0 && (!st.prov||d.prov===st.prov) && (!st.tipo||d.tipo===st.tipo)).sort((a,b)=>b.saldo-a.saldo);
  return det.length?`<table><thead><tr><th>Unidad Ejecutora</th><th>Tipo</th><th>Provincia</th><th class="num">Existencia</th><th class="num">Días cobertura</th></tr></thead><tbody>
    ${det.map(d=>`<tr><td>${d.ue}</td><td style="color:var(--mut)">${d.tipo||'—'}</td><td>${d.prov||'—'}</td><td class="num">${f(d.saldo)}</td><td class="num"><span class="dias ${diasClass(d.dias)}" style="min-width:auto;padding:1px 6px">${diasLabel(d.dias)}</span></td></tr>`).join('')}
    </tbody></table>`:'<p style="color:#a93226;padding:10px">Sin existencia en instalaciones'+(st.prov?' en '+st.prov:'')+(st.tipo?' ('+st.tipo+')':'')+'.</p>';
}

// ============ FILTROS ============
function onSearch(v){ st.q=v.toLowerCase(); st.expand=null; st.skuSel=null; render(); updateMap(); }
function onProv(v){ st.prov=v; render(); updateMap(); drawProvBand(); }
function onTipo(v){ st.tipo=v; render(); updateMap(); }
function onImp(v){ st.imp=v; document.querySelectorAll('#impSeg button').forEach(b=>b.classList.toggle('on',b.dataset.imp===v)); st.expand=null; st.skuSel=null; render(); updateMap(); }
function sortBy(k){ if(st.sort.k===k)st.sort.d*=-1; else st.sort={k,d:(k==='sum')?1:1}; render(); }

// ============ INIT ============
function boot(){
  OPT = m.optimo_dias || 90;
  document.getElementById('hsub').textContent=`Caja de Seguro Social · Panamá · ${m.n_sku} medicamentos · corte ${m.fecha}`;
  document.getElementById('instBadge').textContent=`${m.n_sku} medicamentos · ${Object.keys(D.inst).length} instalaciones mapeadas`;
  const ps=document.getElementById('provSel');
  D.provincias.forEach(p=>{ const o=document.createElement('option');o.value=p;o.textContent=p;ps.appendChild(o); });
  const ts=document.getElementById('tipoSel');
  (D.tipos||[]).forEach(t=>{ const o=document.createElement('option');o.value=t;o.textContent=t;ts.appendChild(o); });
  drawProvBand();
  initMap(); render();
}
// ---- carga de datos externa ----
fetch('data.json').then(r=>r.json()).then(json=>{ D=json; m=D.meta; boot(); })
  .catch(e=>{ document.getElementById('tb').innerHTML='<tr><td colspan=7 style="padding:20px;color:#a93226">No se pudo cargar data.json. Verifique que esté junto al index.html.</td></tr>'; console.error(e); });

// ============ PWA ============
let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; document.getElementById('installBtn').style.display='inline-block'; });
document.getElementById('installBtn').addEventListener('click',async()=>{ if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; document.getElementById('installBtn').style.display='none'; } });
// service worker externo (cache offline)
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW:',e)); });
}
</script>
