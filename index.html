  /* modal explicativo (texto) */

  @media(min-width:560px){.modal-bg{align-items:center}.modal{border-radius:14px}}

    #tablaNac td[data-lbl=""]:before{content:""}

<body>
<header>
  <div class="brand">
    <img src="icons/icon-192.png" alt="Caja de Seguro Social"/>
    <div><div class="sub">Búsqueda de medicamentos</div><div class="ttl">Mi Farma Digital</div></div>
  </div>
  <div class="hdr-actions">
    <button id="btnInstall">Instalar</button>
    <div class="hdr-right">Caja de Seguro Social · Panamá</div>
  </div>
</header>

<div class="wrap">
  <button id="btnBack" onclick="volver()"><i class="ti ti-arrow-left"></i> Volver</button>
  <div class="hero" id="hero"><h1>¿Buscas tu medicina?</h1><p>Consulta en la unidad más cercana a ti.</p></div>

  <div class="searchbar">
    <div class="searchbox"><i class="ti ti-search" style="color:#1e5a9e;font-size:20px"></i>
      <input id="q" placeholder="Escriba el medicamento…" autocomplete="off"/>
      <button id="btnClear" onclick="limpiar()" style="display:none;background:none;border:none;color:#888;font-size:20px;cursor:pointer;padding:0 4px">×</button></div>
    <button class="btn" onclick="doSearch()">Buscar</button>
    <div id="suggest" class="suggest" style="display:none"></div>
  </div>

  <div class="filters">
    <button class="btn-ghost" id="btnGeo" onclick="useGeo()"><i class="ti ti-map-pin"></i> Usar mi ubicación</button>
    <select id="fProv"><option value="">Todas las provincias</option></select>
    <select id="fTipo"><option value="">Todo tipo de unidad</option></select>
    <select id="fSistema"><option value="">Todo sistema/uso</option></select>
    <select id="fCrit"><option value="">Toda criticidad</option><option value="VITAL">Solo vitales</option></select>
  </div>

  <div class="metrics" id="metrics"></div>
  <div id="nearby"></div>
  <div id="welcome"></div>

  <div id="medhead"></div>
  <div id="mapViews" style="display:none;gap:6px;margin-bottom:8px">
    <button class="mv-btn" data-v="pais" onclick="setVista('pais')">Vista país</button>
    <button class="mv-btn" data-v="prov" onclick="setVista('prov')">Mi provincia</button>
    <button class="mv-btn" data-v="sector" onclick="setVista('sector')">Mi sector</button>
  </div>
  <div id="map" style="display:none"></div>
  <div class="map-stats" id="mapStats" style="display:none"></div>
  <div class="legend" id="legend" style="display:none">
    <span><span class="dot" style="background:#1d9e75"></span>Disponible</span>
    <span><span class="dot" style="background:#d89a1a"></span>Quedan pocas</span>
    <span><span class="dot" style="background:#c0392b"></span>Sin existencia</span>
    <span><span class="dot" style="background:#1e5a9e"></span>Tu ubicación</span>
    <span style="color:#888;font-style:italic">· toca un punto para ver la unidad</span>
  </div>
  <div class="scope" id="scope"></div>
  <div class="results" id="results"></div>
</div>

<div class="modal-bg" id="tablaBg" onclick="if(event.target===this)cerrarTabla()">
  <div id="tablaModal" style="background:#fff;border-radius:12px;width:96%;max-width:1000px;max-height:88vh;overflow:hidden;display:flex;flex-direction:column"></div>
</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)cerrarModal()"><div class="modal" id="modal"></div></div>

<script>
const OPT=90;
const RADIO_SECTOR=10; // km — define "mi sector" (mi zona cercana)
let D=null,map=null,heatMal=null,heatBien=null,markerLayer=null,userPos=null,selected=null,deferredPrompt=null,geoNegada=false,vistaMapa='auto';
function norm(s){return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();}
function f(n){return (n==null||n==='')?'—':Number(n).toLocaleString('es-PA');}
function haversine(a,b,c,d){const R=6371,r=Math.PI/180;const dla=(c-a)*r,dlo=(d-b)*r;const x=Math.sin(dla/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dlo/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
const API_URL='';

/* Traducción logística a lenguaje usuario (punto 7) */
const ABC_USR={A:'Uso muy frecuente',B:'Uso frecuente',C:'Uso ocasional'};
const XYZ_USR={X:'Demanda estable',Y:'Demanda variable',Z:'Demanda esporádica'};
function pctColor(p){return p>=90?'#1d9e75':(p>=70?'#d89a1a':'#c0392b');}

function estadoUE(saldo,dias,nivel){
  if(saldo<=0||nivel==='SIN EXISTENCIA')return {clr:'bad',col:'#c0392b',et:'Sin existencia',cv:'consulta otra unidad'};
  if(dias>=9999||nivel==='SIN CONSUMO (con stock)')return {clr:'ok',col:'#1d9e75',et:'Disponible',cv:'hay existencias'};
  const dtxt=Math.round(dias)+' días';
  if(dias>=30)return {clr:'ok',col:'#1d9e75',et:'Disponible',cv:'alcanza ~'+dtxt};
  return {clr:'warn',col:'#d89a1a',et:'Quedan pocas',cv:'alcanza ~'+dtxt};
}

function cargarData(){return new Promise((res,rej)=>{
  fetch('data.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw 0;return r.json();})
    .then(j=>(j&&j.sku)?res(j):viaGAS(res,rej)).catch(()=>viaGAS(res,rej));});}
function viaGAS(res,rej){if(!API_URL)return rej(new Error('sin datos'));
  const cb='__mfd_'+Date.now(),sc=document.createElement('script');let done=false;
  const to=setTimeout(()=>{if(!done){done=true;cl();rej(new Error('timeout'));}},8000);
  function cl(){clearTimeout(to);delete window[cb];if(sc.parentNode)sc.parentNode.removeChild(sc);}
  window[cb]=j=>{if(done)return;done=true;cl();(j&&j.sku)?res(j):rej(new Error('vacío'));};
  sc.onerror=()=>{if(!done){done=true;cl();rej(new Error('error'));}};
  sc.src=API_URL+(API_URL.indexOf('?')>=0?'&':'?')+'action=getData&callback='+cb;document.body.appendChild(sc);}

cargarData().then(j=>{D=j;boot();}).catch(e=>{document.getElementById('results').innerHTML='<div class="empty">No se pudo cargar la información. Intente más tarde.</div>';console.error(e);});

function boot(){
  renderMetrics(null);
  const fp=document.getElementById('fProv');D.provincias.forEach(p=>fp.innerHTML+='<option>'+p+'</option>');
  const ft=document.getElementById('fTipo');D.tipos.forEach(t=>ft.innerHTML+='<option>'+t+'</option>');
  const fs=document.getElementById('fSistema');
  const sistemas=[...new Set(D.sku.filter(s=>s.sistema).map(s=>s.sistema))].sort();
  sistemas.forEach(s=>fs.innerHTML+='<option>'+s+'</option>');
  const fc=document.getElementById('fCrit');
  fs.onchange=fc.onchange=()=>{ if(selected)renderResults(); else renderNearby(); };
  fp.onchange=()=>{
    if(selected){vistaMapa='pais';marcaVista();renderResults();}
    else{ provFiltroInicio=fp.value; renderMetrics(null); renderNearby(); } // tarjetas + mapa adaptados a provincia
  };
  ft.onchange=()=>{ if(selected)renderResults(); else renderNearby(); };
  const q=document.getElementById('q'),sg=document.getElementById('suggest');
  q.addEventListener('input',()=>{
    document.getElementById('btnClear').style.display=q.value?'block':'none';
    if(selected){selected=null;} // limpiar selección al reescribir
    const v=norm(q.value);if(v.length<2){sg.style.display='none';sgIdx=-1;return;}
    const fsv=document.getElementById('fSistema').value, fcv=document.getElementById('fCrit').value;
    let hits=D.sku.filter(s=>norm(s.nombre).includes(v));
    if(fsv)hits=hits.filter(s=>s.sistema===fsv);
    if(fcv==='VITAL')hits=hits.filter(s=>s.vital==='VITAL');
    hits=hits.slice(0,12);
    if(!hits.length){sg.style.display='none';sgIdx=-1;return;}
    sgHits=hits;sgIdx=-1;
    sg.innerHTML=hits.map((s,i)=>'<div data-i="'+i+'" onclick="pick(\''+s.cod+'\')">'+s.nombre+'<span class="sg-tag">'+s.lom+(s.vital==='VITAL'?' · Vital':'')+'</span></div>').join('');
    sg.style.display='block';});
  q.addEventListener('keydown',e=>{
    const sgv=document.getElementById('suggest');
    if(sgv.style.display==='block'&&sgHits.length){
      if(e.key==='ArrowDown'){e.preventDefault();sgIdx=Math.min(sgIdx+1,sgHits.length-1);marcaSug();return;}
      if(e.key==='ArrowUp'){e.preventDefault();sgIdx=Math.max(sgIdx-1,0);marcaSug();return;}
      if(e.key==='Enter'){e.preventDefault();if(sgIdx>=0){pick(sgHits[sgIdx].cod);}else{doSearch();}return;}
    } else if(e.key==='Enter'){doSearch();}
  });
  q.addEventListener('focus',()=>{ if(selected){q.value='';selected=null;} }); // limpiar al reenfocar con renglón ya elegido
  document.addEventListener('click',e=>{if(!e.target.closest('.searchbar')){sg.style.display='none';sgIdx=-1;}});

  pedirGeoSilencioso();
}

/* Métrica de arriba: estática (sin renglón) o inteligente (con renglón elegido) */
function renderMetrics(sku){
  const m=D.meta, box=document.getElementById('metrics');
  if(!sku){
    // VISTA GENERAL (sin renglón): universo · % disponible · días, como el otro equipo
    // Si hay filtro de provincia en inicio, las cifras se adaptan a esa provincia
    const ambito = provFiltroInicio || null;
    let lomTot=m.lom_total, disp=m.lom_disp, pct=parseFloat(m.pct_disp)||0, etiqueta='nacional';
    let med = (m.dias_agregado!=null ? m.dias_agregado : globalMediana(null));
    if(ambito){
      const st=ambitoStats(ambito);lomTot=m.lom_total;disp=st.disp;pct=st.pct;med=st.med;etiqueta=ambito;
    }
    box.innerHTML=
      '<div class="mcard m-blue" onclick="abrirListado()" style="cursor:pointer" title="Ver lista oficial de medicamentos"><div class="big num">'+lomTot+'</div><div class="lbl">medicamentos cubiertos<br>Lista Oficial (LOM) <span style="text-decoration:underline">— ver lista ▸</span></div></div>'+
      '<div class="mcard m-white" style="border-color:'+pctColor2(pct)+'55"><button class="help" onclick="explicarMetrica()">ⓘ</button><div class="big num" style="color:'+pctColor2(pct)+'">'+pct+'%</div><div class="lbl">disponibles '+etiqueta+'<br>'+disp+' de '+lomTot+' · óptimo ≥90%</div></div>'+
      '<div class="mcard m-white" style="border-color:#1d9e7555"><button class="help" onclick="explicarDias()">ⓘ</button><div class="big num" style="color:#1d9e75">'+(med==null?'—':med)+'<span style="font-size:13px"> días</span></div><div class="lbl">de abastecimiento<br>'+etiqueta+(ambito?'':' (nacional)')+'</div></div>';
    return;
  }
  // VISTA RENGLÓN: el mismo medicamento, días protagonista, nacional/provincia/sector
  const filas=(D.det[sku.cod]||[]);
  const statOf=arr=>{const t=arr.length;if(!t)return {pct:null,med:null};
    const c=arr.filter(x=>x.saldo>0).length;
    const dd=arr.filter(x=>x.saldo>0&&x.dias>0&&x.dias<9999).map(x=>x.dias).sort((a,b)=>a-b);
    const med=dd.length?Math.round(dd[Math.floor(dd.length/2)]):null;
    return {pct:Math.round(c/t*100),med:med};};
  const nac=statOf(filas);
  let prov={pct:null,med:null},sect={pct:null,med:null},provName='',sectN=0;
  if(userPos){
    const near=ueMasCercana(); provName=near?near.u.prov:'';
    if(provName)prov=statOf(filas.filter(x=>x.prov===provName));
    const ensector=filas.filter(x=>x.lat&&haversine(userPos[0],userPos[1],x.lat,x.lng)<=RADIO_SECTOR);
    sectN=ensector.length; sect=statOf(ensector);
  }
  function card(lbl,st,extra){const c=st.med==null?'#888':diasColorM(st.med);
    const diasBig=st.med!=null?'<div class="big num" style="color:'+c+'">'+st.med+'<span style="font-size:13px"> días</span></div>':'<div class="big num" style="color:#888">—</div>';
    const pctChip=st.pct!=null?'<span style="font-size:11px;color:'+pctColor2(st.pct)+'">'+st.pct+'% disponible</span>':'';
    return '<div class="mcard m-white" style="border-color:'+c+'33">'+diasBig+'<div class="lbl">'+lbl+(pctChip?'<br>'+pctChip:'')+(extra?'<br>'+extra:'')+'</div></div>';}
  box.innerHTML=
    card('cobertura nacional',nac,'')+
    (userPos?card('en tu provincia',prov,provName):card('en tu provincia',{pct:null,med:null},'activa ubicación'))+
    (userPos?card('en tu sector',sect,sectN+' unidades a ≤'+RADIO_SECTOR+'km'):card('en tu sector',{pct:null,med:null},'activa ubicación'));
}
function pctColor2(p){return p>=90?'#1d9e75':(p>=60?'#d89a1a':'#c0392b');}
function diasColorM(d){return d>=90?'#1d9e75':(d>=30?'#d89a1a':'#c0392b');}
// mediana global de días (todos los renglones LOM, opcionalmente filtrado por provincia)
function globalMediana(prov){
  const dd=[];const lomSet=new Set(D.sku.filter(s=>s.lom==='LOM').map(s=>s.cod));
  Object.keys(D.det).forEach(cod=>{if(!lomSet.has(cod))return;
    D.det[cod].forEach(x=>{if(prov&&x.prov!==prov)return;
      if(x.saldo>0&&x.dias>0&&x.dias<9999)dd.push(x.dias);});});
  if(!dd.length)return null;dd.sort((a,b)=>a-b);return Math.round(dd[Math.floor(dd.length/2)]);
}
// estadísticas de un ámbito (provincia): % LOM disponible + mediana días
function ambitoStats(prov){
  const lomSet=new Set(D.sku.filter(s=>s.lom==='LOM').map(s=>s.cod));
  let con=0,tot=0;
  lomSet.forEach(cod=>{const filas=(D.det[cod]||[]).filter(x=>x.prov===prov);
    if(filas.length){tot++;if(filas.some(x=>x.saldo>0))con++;}});
  return {disp:con,pct:tot?Math.round(con/tot*100):0,med:globalMediana(prov)};
}

/* ===== Inicio: UE más cercana (puntos 2+4) ===== */
function ueMasCercana(){
  if(!userPos)return null;
  let best=null,bd=1e9;
  Object.keys(D.inst).forEach(id=>{const u=D.inst[id];if(!u.lat||!u.lom_tot)return;
    const d=haversine(userPos[0],userPos[1],u.lat,u.lng);if(d<bd){bd=d;best={id:id,u:u,dist:d};}});
  return best;
}

function mejoresRenglones(){
  // renglones LOM con mejor cobertura, respetando filtros activos (provincia/sistema/criticidad)
  const fProv = provFiltroInicio || (document.getElementById('fProv')||{}).value || '';
  const fSis  = (document.getElementById('fSistema')||{}).value || '';
  const fCrit = (document.getElementById('fCrit')||{}).value || '';
  const fTipo = (document.getElementById('fTipo')||{}).value || '';
  const top=D.sku.filter(s=>s.lom==='LOM')
   .filter(s=>!fSis || s.sistema===fSis)
   .filter(s=>fCrit!=='VITAL' || s.vital==='VITAL')
   .map(s=>{
    let filas=D.det[s.cod]||[];
    if(fProv) filas=filas.filter(x=>x.prov===fProv);
    if(fTipo) filas=filas.filter(x=>x.tipo===fTipo);
    const dd=filas.filter(x=>x.saldo>0&&x.dias>0&&x.dias<9999).map(x=>x.dias).sort((a,b)=>a-b);
    const med=dd.length?Math.round(dd[Math.floor(dd.length/2)]):0;
    const con=filas.filter(x=>x.saldo>0).length,tot=filas.length;const pct=tot?Math.round(con/tot*100):0;
    return {cod:s.cod,nombre:s.nombre,med:med,pct:pct};
  }).filter(x=>x.pct>=95).sort((a,b)=>b.med-a.med).slice(0,4);
  if(!top.length)return '';
  return '<div style="margin-top:14px"><div style="font-size:12px;font-weight:600;color:#0f6e56;margin-bottom:6px"><i class="ti ti-circle-check"></i> Medicamentos con mejor abastecimiento</div>'+
    top.map(t=>'<div onclick="pick(\''+t.cod+'\')" style="display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:#f3faf7;border:1px solid #d4ede2;border-radius:6px;margin-bottom:5px;cursor:pointer;font-size:12.5px">'+
      '<span style="color:#0C447C">'+t.nombre.split(',')[0]+'</span>'+
      '<span style="font-family:Consolas,monospace;color:#1d9e75;font-weight:700;white-space:nowrap">~'+t.med+' días · '+t.pct+'%</span></div>').join('')+
    '</div>';
}
let provFiltroInicio='';
function dibujarMiniMapa(near){
  if(typeof L==='undefined')return;
  setTimeout(()=>{
    const el=document.getElementById('miniMap');if(!el||el._leaflet_id)return;
    const centro = provFiltroInicio ? null : userPos;
    const mm=L.map('miniMap',{scrollWheelZoom:false,zoomControl:false,attributionControl:false});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18}).addTo(mm);
    const pts=[];
    Object.keys(D.inst).forEach(id=>{const v=D.inst[id];if(!v.lat||!v.lom_tot)return;
      // si hay filtro de provincia en inicio, mostrar esa provincia; si no, el sector cercano
      if(provFiltroInicio){ if(v.prov!==provFiltroInicio)return; }
      else if(userPos){ if(haversine(userPos[0],userPos[1],v.lat,v.lng)>RADIO_SECTOR*1.5)return; }
      const c=v.pct>=90?'#1d9e75':(v.pct>=60?'#d89a1a':'#c0392b');
      L.circleMarker([v.lat,v.lng],{radius:7,fillColor:c,color:'#fff',weight:1.5,fillOpacity:.95})
        .addTo(mm).bindPopup('<b>'+v.nombre+'</b><br>Abastecimiento: '+v.pct+'%');
      pts.push([v.lat,v.lng]);
    });
    if(!provFiltroInicio&&userPos){L.marker(userPos,{icon:L.divIcon({className:'',html:'<div style="width:14px;height:14px;border-radius:50%;background:#1e5a9e;border:3px solid #fff;box-shadow:0 0 0 4px rgba(30,90,158,.3)"></div>',iconSize:[14,14],iconAnchor:[7,7]})}).addTo(mm);pts.push(userPos);}
    // pintar provincia (del filtro o del usuario)
    if(typeof PROVINCIAS_POLIGONOS!=='undefined'){
      let tp=null;
      if(provFiltroInicio) tp=PROVINCIAS_POLIGONOS.find(p=>p.prov===provFiltroInicio);
      else if(userPos&&typeof turf!=='undefined'){try{const pt=turf.point([userPos[1],userPos[0]]);tp=PROVINCIAS_POLIGONOS.find(p=>turf.booleanPointInPolygon(pt,p.geometry));}catch(e){}}
      if(tp){L.geoJSON(tp.geometry,{style:{color:'#1e5a9e',weight:1.5,fillColor:'#1e5a9e',fillOpacity:0.06,dashArray:'3 3'}}).addTo(mm);}
    }
    // ruta al nodo más cercano (OSRM por calles), solo en vista de sector del usuario
    if(!provFiltroInicio&&userPos&&near&&near.u){
      const dest=[near.u.lat,near.u.lng];
      const url='https://router.project-osrm.org/route/v1/driving/'+userPos[1]+','+userPos[0]+';'+dest[1]+','+dest[0]+'?overview=full&geometries=geojson';
      fetch(url).then(r=>r.json()).then(j=>{
        if(j.routes&&j.routes.length){
          const cc=j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
          L.polyline(cc,{color:'#1e5a9e',weight:3.5,opacity:.7}).addTo(mm);
          const km=(j.routes[0].distance/1000).toFixed(1);
          L.marker(dest,{icon:L.divIcon({className:'',html:'<div style="font-size:20px;line-height:1">🏥</div>',iconSize:[20,20],iconAnchor:[10,18]})}).addTo(mm).bindPopup('<b>'+near.u.nombre+'</b><br>A '+km+' km por carretera');
          try{mm.fitBounds([userPos,dest],{padding:[35,35],maxZoom:14});}catch(e){}
        }
      }).catch(e=>{});
    }
    if(pts.length){try{mm.fitBounds(pts,{padding:[25,25],maxZoom:provFiltroInicio?10:12});}catch(e){mm.setView(userPos||[8.5,-80],8);}}
    else mm.setView(userPos||[8.5,-80],8);
    setTimeout(()=>mm.invalidateSize(),150);
  },100);
}

function filasActivas(){let filas=(D.det[selected.cod]||[]).slice();
  const ft=document.getElementById('fTipo').value;
  // Alcance geográfico = la VISTA del mapa (filtro adaptativo)
  if(vistaMapa==='sector'&&userPos){
    filas=filas.filter(x=>x.lat&&haversine(userPos[0],userPos[1],x.lat,x.lng)<=RADIO_SECTOR);
  } else if(vistaMapa==='prov'&&userPos){
    const near=ueMasCercana();const pr=near?near.u.prov:null;
    if(pr)filas=filas.filter(x=>x.prov===pr);
  } else {
    // vista país: respeta el filtro manual de provincia si el usuario lo usó
    const fp=document.getElementById('fProv').value;
    if(fp)filas=filas.filter(x=>x.prov===fp);
  }
  if(ft)filas=filas.filter(x=>x.tipo===ft);
  if(userPos){filas.forEach(x=>x.dist=haversine(userPos[0],userPos[1],x.lat,x.lng));filas.sort((a,b)=>a.dist-b.dist);}
  else filas.sort((a,b)=>b.saldo-a.saldo);return filas;}

      '<div class="stat"><div class="st s-'+e.clr+'">'+e.et+'</div><div class="cv">'+e.cv+'</div></div></div>';}).join('');
  window._filas=filas;
}

function renderMap(filas){
  document.getElementById('map').style.display='block';
  document.getElementById('mapStats').style.display='flex';
  document.getElementById('legend').style.display='flex';
  document.getElementById('mapViews').style.display='flex';
  marcaVista();
  if(!map){map=L.map('map',{scrollWheelZoom:true}).setView([8.5,-80],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);markerLayer=L.layerGroup().addTo(map);}
  markerLayer.clearLayers();
  if(heatMal){map.removeLayer(heatMal);heatMal=null;}if(heatBien){map.removeLayer(heatBien);heatBien=null;}
  const conStock=filas.filter(x=>x.saldo>0);const valOf=d=>(d>=9999?OPT*1.2:d);
  const hMal=conStock.filter(x=>valOf(x.dias)<OPT).map(x=>{const falta=1-Math.min(valOf(x.dias),OPT)/OPT;return [x.lat,x.lng,Math.max(0.15,falta)];});
  const hBien=conStock.filter(x=>valOf(x.dias)>=OPT*0.6).map(x=>{const bien=Math.min(1,(valOf(x.dias)-OPT*0.6)/(OPT*0.4));return [x.lat,x.lng,Math.max(0.15,bien)];});
  if(hBien.length)heatBien=L.heatLayer(hBien,{radius:38,blur:28,minOpacity:.25,max:1.0,gradient:{0.0:'rgba(39,174,96,0)',0.5:'#7dcea0',1.0:'#1e8449'}}).addTo(map);
  if(hMal.length)heatMal=L.heatLayer(hMal,{radius:38,blur:28,minOpacity:.30,max:1.0,gradient:{0.0:'rgba(192,57,43,0)',0.4:'#f4d03f',0.7:'#e67e22',1.0:'#c0392b'}}).addTo(map);
  const pts=[];let primerMk=null;
  filas.forEach((x,i)=>{if(!x.lat)return;const e=estadoUE(x.saldo,x.dias,x.nivel);
    const mk=L.circleMarker([x.lat,x.lng],{radius:8,fillColor:e.col,color:'#fff',weight:1.5,fillOpacity:.95});
    const cob=x.saldo>0?('<br>'+e.et+' · '+e.cv):'<br>Sin existencia';
    const tel=x.tel?'<br><i>'+x.tel.split(';')[0]+'</i>':'';
    mk.bindPopup('<b>'+x.nombre+'</b><br>'+(x.loc||x.prov)+' · '+(x.tipo||'')+cob+'<br>Existencia: '+f(x.saldo)+tel+'<br><a href="javascript:abrirModal('+i+')">Ver más →</a>');
    mk.on('click',function(){this.openPopup();});
    markerLayer.addLayer(mk);pts.push([x.lat,x.lng]);
    if(i===0)primerMk=mk;});
  if(userPos){L.marker(userPos,{icon:L.divIcon({className:'',html:'<div style="width:16px;height:16px;border-radius:50%;background:#1e5a9e;border:3px solid #fff;box-shadow:0 0 0 5px rgba(30,90,158,.3)"></div>',iconSize:[16,16],iconAnchor:[8,8]})}).addTo(markerLayer).bindPopup('Tu ubicación');}
  window._mapPts=pts;
  pintarProvinciaUsuario(filas);
  encuadrar(filas);
  setTimeout(()=>map.invalidateSize(),200);drawMapStats(filas);
  // popup automático en la UE más cercana (primera) para mostrar que es interactivo
  if(primerMk&&userPos)setTimeout(()=>{try{primerMk.openPopup();}catch(e){}},700);
}

// ---- Mapa interactivo: pintar provincia del usuario + ruta al nodo más cercano ----
let provLayer=null, rutaLayer=null;
function provinciaDe(lat,lng){
  if(typeof turf==='undefined'||typeof PROVINCIAS_POLIGONOS==='undefined')return null;
  try{
    const pt=turf.point([lng,lat]);
    for(const pr of PROVINCIAS_POLIGONOS){
      if(turf.booleanPointInPolygon(pt,pr.geometry))return pr;
    }
  }catch(e){}
  return null;
}
function pintarProvinciaUsuario(filas){
  if(provLayer){map.removeLayer(provLayer);provLayer=null;}
  if(!userPos)return;
  // qué provincia resaltar: la del filtro activo, o la del usuario
  let target=null;
  const fp=(document.getElementById('fProv')||{}).value||'';
  if(fp){ target=PROVINCIAS_POLIGONOS.find(p=>p.prov===fp); }
  else { target=provinciaDe(userPos[0],userPos[1]); }
  if(!target)return;
  provLayer=L.geoJSON(target.geometry,{style:{color:'#1e5a9e',weight:2,fillColor:'#1e5a9e',fillOpacity:0.07,dashArray:'4 3'}}).addTo(map);
}
function trazarRutaAlNodo(){
  if(rutaLayer){map.removeLayer(rutaLayer);rutaLayer=null;}
  if(!userPos)return;
  const near=ueMasCercana();
  if(!near||!near.u)return;
  const dest=[near.u.lat,near.u.lng];
  // OSRM público: ruta por calles
  const url='https://router.project-osrm.org/route/v1/driving/'+userPos[1]+','+userPos[0]+';'+dest[1]+','+dest[0]+'?overview=full&geometries=geojson';
  fetch(url).then(r=>r.json()).then(j=>{
    if(!j.routes||!j.routes.length)return;
    const coords=j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
    rutaLayer=L.polyline(coords,{color:'#1e5a9e',weight:4,opacity:.75}).addTo(map);
    // banderita en el nodo destino
    L.marker(dest,{icon:L.divIcon({className:'',html:'<div style="font-size:22px;line-height:1">🏥</div>',iconSize:[22,22],iconAnchor:[11,20]})}).addTo(rutaLayer);
  }).catch(e=>{
    // fallback: línea directa si OSRM falla
    rutaLayer=L.polyline([userPos,dest],{color:'#1e5a9e',weight:3,opacity:.6,dashArray:'6 4'}).addTo(map);
  });
}
function encuadrar(filas){
  if(!map)return;
  if(rutaLayer){map.removeLayer(rutaLayer);rutaLayer=null;}
  if(vistaMapa==='sector'&&userPos){
    const near=ueMasCercana();
    if(near&&near.u){
      trazarRutaAlNodo();
      try{map.fitBounds([userPos,[near.u.lat,near.u.lng]],{padding:[60,60],maxZoom:14});}catch(e){map.setView(userPos,12);}
    } else { map.setView(userPos,12); }
    return;
  }
  if(vistaMapa==='prov'&&userPos){
    const near=ueMasCercana();const pr=near?near.u.prov:null;
    const pp=filas.filter(x=>x.lat&&x.prov===pr).map(x=>[x.lat,x.lng]);
    if(pp.length){try{map.fitBounds(pp,{padding:[35,35],maxZoom:11});}catch(e){}return;}
  }
  if(vistaMapa==='pais'){const all=filas.filter(x=>x.lat).map(x=>[x.lat,x.lng]);if(all.length){try{map.fitBounds(all,{padding:[30,30],maxZoom:9});}catch(e){}return;}}
  // auto
  const pts=(window._mapPts||[]).slice();if(userPos)pts.push(userPos);
  if(pts.length){try{map.fitBounds(pts,{padding:[35,35],maxZoom:userPos?12:9});}catch(e){}}
}
function setVista(v){vistaMapa=v;marcaVista();sincronizarFiltros();if(selected)renderResults();}
function sincronizarFiltros(){
  const fp=document.getElementById('fProv');
  // En vista provincia o sector, el filtro de provincia es redundante -> ocultarlo
  if((vistaMapa==='prov'||vistaMapa==='sector')&&userPos){
    fp.style.display='none';
  } else {
    fp.style.display='';
  }
}
function marcaVista(){const has=!!userPos;[].forEach.call(document.querySelectorAll('.mv-btn'),b=>{
  const v=b.getAttribute('data-v');
  b.classList.toggle('active',vistaMapa===v||(vistaMapa==='auto'&&v==='sector'&&has)||(vistaMapa==='auto'&&v==='pais'&&!has));
  if((v==='prov'||v==='sector')&&!has){b.disabled=true;b.style.opacity=.5;b.title='Activa tu ubicación';}else{b.disabled=false;b.style.opacity=1;b.title='';}
});}
function drawMapStats(filas){
  const conStock=filas.filter(x=>x.saldo>0);
  const reales=conStock.filter(x=>x.dias>0&&x.dias<9999).map(x=>x.dias).sort((a,b)=>a-b);
  const med=reales.length?Math.round(reales[Math.floor(reales.length/2)]):null;
  const opt=conStock.filter(x=>x.dias>=OPT).length;
  const bajo=conStock.filter(x=>x.dias>=30&&x.dias<OPT).length;
  const crit=conStock.filter(x=>x.dias>0&&x.dias<30).length;
  const desab=filas.filter(x=>x.saldo<=0).length;
  document.getElementById('mapStats').innerHTML=
    '<div class="st"><div class="v" style="color:#1d9e75">'+(med==null?'—':med)+'</div><div class="l">días mediana<br>donde hay stock</div></div>'+
    '<div class="st"><div class="v" style="color:#1d9e75">'+opt+'</div><div class="l">óptimas<br>≥90 días</div></div>'+
    '<div class="st"><div class="v" style="color:#d89a1a">'+(bajo+crit)+'</div><div class="l">cobertura baja<br>&lt;90 días</div></div>'+
    '<div class="st"><div class="v" style="color:#c0392b">'+desab+'</div><div class="l">sin existencia<br>saldo cero</div></div>';
}

/* ===== Listado nacional consolidado (para prensa/instituciones) ===== */
let _listaRows=[], _listaSort={col:'pct',dir:'desc'};
function abrirListado(){
  _listaRows=D.sku.filter(s=>s.lom==='LOM').map(s=>{
    const filas=D.det[s.cod]||[];
    const con=filas.filter(x=>x.saldo>0).length, tot=filas.length;
    const pct=tot?Math.round(con/tot*100):0;
    const dd=filas.filter(x=>x.saldo>0&&x.dias>0&&x.dias<9999).map(x=>x.dias).sort((a,b)=>a-b);
    const med=dd.length?Math.round(dd[Math.floor(dd.length/2)]):null;
    const stock=filas.reduce((a,x)=>a+(x.saldo||0),0);
    const cons=filas.reduce((a,x)=>a+(x.cons||0),0);
    return {cod:s.cod,nombre:s.nombre,sistema:s.sistema||'',vital:s.vital==='VITAL',pct:pct,med:med,ue:con,stock:Math.round(stock),cons:Math.round(cons)};
  });
  _listaSort={col:'pct',dir:'desc'}; // buenas noticias primero
  _listaFiltros={txt:'',sistema:'',crit:''};
  renderLista();
  document.getElementById('tablaBg').classList.add('show');
}
let _listaFiltros={txt:'',sistema:'',crit:''};
function renderLista(){
  const m=document.getElementById('tablaModal');
  let rows=_listaRows.slice();
  // filtros internos
  if(_listaFiltros.txt)rows=rows.filter(r=>norm(r.nombre).includes(norm(_listaFiltros.txt)));
  if(_listaFiltros.sistema)rows=rows.filter(r=>r.sistema===_listaFiltros.sistema);
  if(_listaFiltros.crit==='VITAL')rows=rows.filter(r=>r.vital);
  rows.sort((a,b)=>{
    let av=a[_listaSort.col],bv=b[_listaSort.col];
    if(_listaSort.col==='nombre'){av=norm(av);bv=norm(bv);return _listaSort.dir==='asc'?(av<bv?-1:1):(av>bv?-1:1);}
    av=av==null?-1:av;bv=bv==null?-1:bv;
    return _listaSort.dir==='asc'?av-bv:bv-av;
  });
  _listaVista=rows; // para exportar lo filtrado
  const sistemas=[...new Set(_listaRows.map(r=>r.sistema).filter(Boolean))].sort();
  function th(lbl,col){const act=_listaSort.col===col;const ar=act?(_listaSort.dir==='asc'?' ▲':' ▼'):'';
    return '<th onclick="ordenarLista(\''+col+'\')" style="cursor:pointer;padding:8px;border-bottom:2px solid #1e5a9e;white-space:nowrap;'+(act?'color:#1e5a9e':'')+'">'+lbl+ar+'</th>';}
  let html='<div style="padding:14px 18px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:flex-start;gap:10px">'+
    '<div><div style="font-size:17px;font-weight:600;color:#0C447C">Listado nacional consolidado</div>'+
    '<div style="font-size:12px;color:#666">'+rows.length+' de '+_listaRows.length+' medicamentos LOM · toca una fila para ver detalle por unidad</div></div>'+
    '<button onclick="cerrarTabla()" style="background:#0C447C;color:#fff;border:none;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;flex-shrink:0">×</button></div>'+
    // filtros internos + descarga
    '<div style="padding:10px 18px;border-bottom:1px solid #eee;display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+
      '<input id="tablaFiltro" value="'+_listaFiltros.txt+'" placeholder="Filtrar medicamento…" oninput="setListaFiltro(\'txt\',this.value)" style="flex:1;min-width:160px;padding:8px 12px;border:1px solid #a8a8a8;border-radius:6px;font-size:14px"/>'+
      '<select onchange="setListaFiltro(\'sistema\',this.value)" style="padding:8px;border:1px solid #a8a8a8;border-radius:6px;font-size:13px"><option value="">Todo sistema</option>'+sistemas.map(s=>'<option'+(s===_listaFiltros.sistema?' selected':'')+'>'+s+'</option>').join('')+'</select>'+
      '<select onchange="setListaFiltro(\'crit\',this.value)" style="padding:8px;border:1px solid #a8a8a8;border-radius:6px;font-size:13px"><option value="">Toda criticidad</option><option value="VITAL"'+(_listaFiltros.crit==='VITAL'?' selected':'')+'>Solo vitales</option></select>'+
      '<button onclick="descargarExcel()" style="background:#1d7349;color:#fff;border:none;border-radius:6px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap"><i class="ti ti-download"></i> Descargar Excel</button>'+
    '</div>'+
    '<div style="overflow:auto;flex:1" class="lista-scroll"><table id="tablaNac" style="width:100%;border-collapse:collapse;font-size:13px">'+
    '<thead style="position:sticky;top:0;background:#f4f6f8;z-index:2"><tr style="text-align:center">'+
    '<th style="text-align:left;padding:8px 10px;border-bottom:2px solid #1e5a9e;cursor:pointer" onclick="ordenarLista(\'nombre\')">Medicamento'+(_listaSort.col==='nombre'?(_listaSort.dir==='asc'?' ▲':' ▼'):'')+'</th>'+
    th('Disponib.','pct')+th('Cobertura','med')+th('UE','ue')+th('Consumo/día','cons')+th('Existencia','stock')+
    '</tr></thead><tbody>';
  rows.forEach(r=>{const c=r.pct>=90?'#1d9e75':(r.pct>=60?'#d89a1a':'#c0392b');
    html+='<tr class="trow" onclick="detalleRenglon(\''+r.cod+'\')" style="cursor:pointer">'+
      '<td data-lbl="" style="padding:7px 10px;border-bottom:1px solid #eee">'+(r.vital?'<span style="color:#b03a2e">★ </span>':'')+r.nombre+(r.sistema?'<br><span style="font-size:11px;color:#888">'+r.sistema+'</span>':'')+'</td>'+
      '<td data-lbl="Disponib." style="text-align:center;padding:7px;border-bottom:1px solid #eee;font-family:Consolas,monospace;font-weight:700;color:'+c+'">'+r.pct+'%</td>'+
      '<td data-lbl="Cobertura" style="text-align:center;padding:7px;border-bottom:1px solid #eee;font-family:Consolas,monospace">'+(r.med!=null?'~'+r.med+'d':'—')+'</td>'+
      '<td data-lbl="UE con stock" style="text-align:center;padding:7px;border-bottom:1px solid #eee;font-family:Consolas,monospace">'+r.ue+'</td>'+
      '<td data-lbl="Consumo/día" style="text-align:center;padding:7px;border-bottom:1px solid #eee;font-family:Consolas,monospace">'+f(r.cons)+'</td>'+
      '<td data-lbl="Existencia" style="text-align:right;padding:7px 10px;border-bottom:1px solid #eee;font-family:Consolas,monospace">'+f(r.stock)+'</td></tr>';
  });
  html+='</tbody></table></div>';
  m.innerHTML=html;
}
let _listaVista=[];
function setListaFiltro(k,v){_listaFiltros[k]=v;const foco=(k==='txt');renderLista();
  if(foco){const i=document.getElementById('tablaFiltro');if(i){i.focus();i.setSelectionRange(v.length,v.length);}}}
function ordenarLista(col){
  if(_listaSort.col===col){_listaSort.dir=_listaSort.dir==='asc'?'desc':'asc';}
  else{_listaSort.col=col;_listaSort.dir=(col==='nombre')?'asc':'desc';}
  renderLista();
}

/* Descarga Excel con formato dashboard */
async function descargarExcel(){
  if(typeof ExcelJS==='undefined'){alert('Cargando librería, intenta de nuevo en un momento.');return;}
  const wb=new ExcelJS.Workbook();
  wb.creator='Mi Farma Digital - CSS';
  const ws=wb.addWorksheet('Disponibilidad LOM',{views:[{state:'frozen',ySplit:4}]});
  // título
  ws.mergeCells('A1:F1');
  ws.getCell('A1').value='MI FARMA DIGITAL — Caja de Seguro Social de Panamá';
  ws.getCell('A1').font={bold:true,size:15,color:{argb:'FF0C447C'}};
  ws.getCell('A1').alignment={horizontal:'center'};
  ws.mergeCells('A2:F2');
  ws.getCell('A2').value='Disponibilidad nacional de medicamentos de la Lista Oficial (LOM) — '+D.meta.fecha;
  ws.getCell('A2').font={size:11,color:{argb:'FF555555'}};
  ws.getCell('A2').alignment={horizontal:'center'};
  ws.addRow([]);
  // encabezados
  const head=['Medicamento','Sistema / Uso','Vital','Disponibilidad %','Cobertura (días)','UE con stock','Consumo/día','Existencia total'];
  const hr=ws.addRow(head);
  hr.eachCell(c=>{c.font={bold:true,color:{argb:'FFFFFFFF'}};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1E5A9E'}};c.alignment={horizontal:'center',wrapText:true};c.border={bottom:{style:'thin'}};});
  // datos (lo filtrado/visible)
  _listaVista.forEach(r=>{
    const row=ws.addRow([r.nombre,r.sistema,r.vital?'Sí':'',r.pct/100,r.med!=null?r.med:'—',r.ue,r.cons,r.stock]);
    row.getCell(4).numFmt='0%';
    const col=r.pct>=90?'FF1D9E75':(r.pct>=60?'FFD89A1A':'FFC0392B');
    row.getCell(4).font={bold:true,color:{argb:col}};
    row.getCell(3).alignment={horizontal:'center'};
    [5,6,7,8].forEach(i=>row.getCell(i).alignment={horizontal:'center'});
    if(r.vital)row.getCell(1).font={color:{argb:'FFB03A2E'}};
  });
  ws.columns=[{width:50},{width:28},{width:7},{width:15},{width:15},{width:13},{width:13},{width:16}];
  ws.autoFilter='A4:H4';
  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download='MiFarmaDigital_LOM_'+D.meta.fecha.replace(/[ :]/g,'_')+'.xlsx';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

/* Detalle de un renglón por UE (escrutinio total, tipo el otro equipo) */
function detalleRenglon(cod){
  const s=D.sku.find(x=>x.cod===cod);if(!s)return;
  const filas=(D.det[cod]||[]).slice().sort((a,b)=>{
    // por provincia, luego por días
    if(a.prov!==b.prov)return a.prov<b.prov?-1:1;
    return (b.saldo>0?b.dias:-1)-(a.saldo>0?a.dias:-1);
  });
  const m=document.getElementById('tablaModal');
  // agrupar por provincia
  const byProv={};filas.forEach(x=>{(byProv[x.prov]=byProv[x.prov]||[]).push(x);});
  let html='<div style="padding:14px 18px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:flex-start">'+
    '<div><a href="javascript:renderLista()" style="color:#1e5a9e;font-size:12px;text-decoration:none">← Volver al listado</a>'+
    '<div style="font-size:16px;font-weight:600;color:#0C447C;margin-top:4px">'+(s.vital==='VITAL'?'★ ':'')+s.nombre+'</div>'+
    '<div style="font-size:12px;color:#666">'+(s.sistema||'')+' · Disponibilidad por unidad ejecutora</div></div>'+
    '<button onclick="cerrarTabla()" style="background:#0C447C;color:#fff;border:none;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer">×</button></div>'+
    '<div style="overflow:auto;flex:1;padding:0 18px 18px">';
  Object.keys(byProv).sort().forEach(prov=>{
    html+='<div style="font-weight:600;color:#0C447C;margin:14px 0 6px;font-size:13px"><i class="ti ti-map-pin"></i> '+prov+' ('+byProv[prov].length+' unidades)</div>'+
      '<table style="width:100%;border-collapse:collapse;font-size:12.5px"><thead><tr style="color:#888;font-size:11px">'+
      '<th style="text-align:left;padding:4px 6px">Unidad</th><th style="padding:4px">Existencia</th><th style="padding:4px">Consumo/día</th><th style="padding:4px">Días</th><th style="padding:4px">Estado</th></tr></thead><tbody>';
    byProv[prov].forEach(x=>{const e=estadoUE(x.saldo,x.dias,x.nivel);
      html+='<tr style="border-bottom:1px solid #f0f0f0">'+
        '<td style="padding:5px 6px">'+x.nombre+(x.loc?'<br><span style="font-size:10px;color:#999">'+x.loc+'</span>':'')+'</td>'+
        '<td style="text-align:center;padding:5px;font-family:Consolas,monospace">'+f(x.saldo)+'</td>'+
        '<td style="text-align:center;padding:5px;font-family:Consolas,monospace">'+(x.cons>0?f(Math.round(x.cons)):'—')+'</td>'+
        '<td style="text-align:center;padding:5px;font-family:Consolas,monospace">'+(x.saldo>0&&x.dias<9999?Math.round(x.dias):'—')+'</td>'+
        '<td style="text-align:center;padding:5px;color:'+e.col+';font-weight:600;white-space:nowrap">'+e.et+'</td></tr>';
    });
    html+='</tbody></table>';
  });
  html+='</div>';
  m.innerHTML=html;
}

/* ===== Geo (puntos 3,4) ===== */
function activarGeo(p){userPos=[p.coords.latitude,p.coords.longitude];geoNegada=false;
  document.getElementById('btnGeo').style.display='none'; // quitar botón cuando ya está activa
  if(selected){renderMetrics(selected);renderResults();} else {renderNearby();renderWelcome();}
  if(map&&!selected)map.flyTo(userPos,11,{duration:.6});
}
function pedirGeoSilencioso(){if(!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(activarGeo,err=>{
    if(err&&err.code===1){geoNegada=true;if(!selected)renderWelcome();} // 1 = permiso denegado
  },{enableHighAccuracy:false,timeout:6000,maximumAge:600000});}
function useGeo(){if(!navigator.geolocation){alert('Tu dispositivo no permite ubicación.');return;}
  navigator.geolocation.getCurrentPosition(activarGeo,err=>{
    if(err&&err.code===1){geoNegada=true;if(!selected)renderWelcome();
      alert('La ubicación está bloqueada para este sitio. Actívala en los permisos del navegador (ícono de candado junto a la dirección).');}
    else alert('No se pudo obtener tu ubicación. Intenta de nuevo.');
  });}

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;
  const b=document.getElementById('btnInstall');b.style.display='inline-block';
  b.onclick=async()=>{b.style.display='none';deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;};});
