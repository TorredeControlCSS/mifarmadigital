<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Farma Digital — Caja de Seguro Social</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,Arial,sans-serif;background:#ececec;color:#222;line-height:1.5}
  .num{font-family:Consolas,'Courier New',monospace}
  a{color:inherit}
  /* Header */
  header{background:#0C447C;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:1000}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .logo{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:#0C447C;font-weight:700;font-size:11px}
  .brand .sub{color:#9fc4ec;font-size:11px;letter-spacing:.4px}
  .brand .ttl{color:#fff;font-size:18px;font-weight:600}
  .hdr-right{color:#9fc4ec;font-size:12px}
  /* Layout */
  .wrap{max-width:1100px;margin:0 auto;padding:20px}
  .hero{text-align:center;margin:8px 0 18px}
  .hero h1{font-size:22px;color:#0C447C;font-weight:600}
  .hero p{font-size:14px;color:#555;margin-top:4px}
  /* Search */
  .searchbar{display:flex;gap:8px;margin:14px 0 10px}
  .searchbox{flex:1;display:flex;align-items:center;background:#fff;border:1px solid #1e5a9e;border-radius:8px;padding:0 14px;height:48px}
  .searchbox input{border:none;outline:none;flex:1;font-size:16px;margin-left:10px;background:transparent}
  .btn{background:#1e5a9e;color:#fff;border:none;border-radius:8px;padding:0 20px;font-size:15px;font-weight:600;cursor:pointer;height:48px}
  .btn:hover{background:#174a85}
  .btn-ghost{background:#fff;border:1px solid #1e5a9e;color:#1e5a9e;border-radius:8px;padding:0 16px;font-weight:600;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px;height:48px}
  .btn-ghost:hover{background:#f0f6fc}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .filters select{padding:8px 12px;border:1px solid #a8a8a8;border-radius:6px;background:#fff;font-size:13px;color:#333}
  /* Metric cards */
  .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
  .mcard{border-radius:10px;padding:14px 16px}
  .mcard .big{font-size:30px;font-weight:700;line-height:1}
  .mcard .lbl{font-size:12px;margin-top:6px}
  .m-blue{background:#0C447C;color:#fff}
  .m-blue .lbl{color:#9fc4ec}
  .m-white{background:#fff;border:1px solid #a8a8a8}
  .m-white .big{color:#1d9e75}
  .m-white .lbl{color:#555}
  .m-amber{background:#fff;border:1px solid #d89a1a}
  .m-amber .big{color:#ba7517}
  .m-amber .lbl{color:#555}
  /* Selected med header */
  .medhead{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #1e5a9e;padding-bottom:8px;margin:14px 0 12px;flex-wrap:wrap;gap:8px}
  .medhead .name{font-size:16px;font-weight:600;color:#0C447C}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:11px;font-weight:600;padding:4px 10px;border-radius:14px}
  .t-lom{background:#e6f1fb;color:#0C447C}
  .t-vital{background:#e1f5ee;color:#0f6e56}
  .t-cat{background:#f1efe8;color:#444}
  .t-nolom{background:#faeee0;color:#a05a12}
  /* Map */
  #map{height:300px;border:1px solid #a8a8a8;border-radius:8px;margin-bottom:6px}
  .legend{display:flex;gap:14px;font-size:11px;color:#666;margin-bottom:14px;flex-wrap:wrap}
  .legend .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
  /* Result cards */
  .scope{font-size:13px;color:#666;margin-bottom:10px}
  .results{display:flex;flex-direction:column;gap:9px}
  .rcard{background:#fff;border:1px solid #a8a8a8;border-radius:6px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .rcard .info .nm{font-size:14px;font-weight:600}
  .rcard .info .meta{font-size:12px;color:#666;margin-top:3px}
  .rcard .info .meta i{color:#1e5a9e}
  .rcard .stat{text-align:right;white-space:nowrap}
  .rcard .stat .st{font-size:12px;font-weight:600}
  .rcard .stat .cv{font-size:11px;color:#888;margin-top:2px}
  .nivel-ALTA,.nivel-ADECUADA{border-left:5px solid #1d9e75}
  .nivel-SEGUIMIENTO{border-left:5px solid #d89a1a}
  .nivel-REDUCIDA{border-left:5px solid #d89a1a}
  .nivel-SINEXISTENCIA{border-left:5px solid #c0392b}
  .st-ok{color:#1d9e75}.st-warn{color:#ba7517}.st-bad{color:#c0392b}
  .empty{padding:30px;text-align:center;color:#888;font-size:14px}
  .suggest{position:absolute;background:#fff;border:1px solid #1e5a9e;border-top:none;border-radius:0 0 8px 8px;max-height:280px;overflow-y:auto;z-index:900;width:100%}
  .suggest div{padding:10px 14px;font-size:14px;cursor:pointer;border-bottom:1px solid #eee}
  .suggest div:hover{background:#f0f6fc}
  .sg-tag{font-size:10px;color:#888;margin-left:6px}
  .loading{padding:40px;text-align:center;color:#1e5a9e}
  footer{text-align:center;font-size:11px;color:#888;padding:16px}
  @media(max-width:640px){.metrics{grid-template-columns:1fr}.hdr-right{display:none}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">CSS</div>
    <div>
      <div class="sub">Búsqueda de medicamentos</div>
      <div class="ttl">Mi Farma Digital</div>
    </div>
  </div>
  <div class="hdr-right">Caja de Seguro Social · República de Panamá</div>
</header>

<div class="wrap">

  <div class="hero">
    <h1>¿Buscas tu medicina?</h1>
    <p>Te decimos si hay y dónde está la unidad más cercana a ti.</p>
  </div>

  <div class="searchbar" style="position:relative">
    <div class="searchbox">
      <i class="ti ti-search" style="color:#1e5a9e;font-size:20px"></i>
      <input id="q" placeholder="Escriba el medicamento…" autocomplete="off"/>
      <div id="suggest" class="suggest" style="display:none"></div>
    </div>
    <button class="btn" onclick="doSearch()">Buscar</button>
  </div>

  <div class="filters">
    <button class="btn-ghost" style="height:auto;padding:8px 14px" onclick="useGeo()"><i class="ti ti-map-pin"></i> Usar mi ubicación</button>
    <select id="fProv"><option value="">Todas las provincias</option></select>
    <select id="fTipo"><option value="">Todo tipo de unidad</option></select>
  </div>

  <div class="metrics" id="metrics"></div>

  <div id="medhead"></div>
  <div id="map" style="display:none"></div>
  <div class="legend" id="legend" style="display:none">
    <span><span class="dot" style="background:#1d9e75"></span>Disponible</span>
    <span><span class="dot" style="background:#d89a1a"></span>Cobertura baja</span>
    <span><span class="dot" style="background:#c0392b"></span>Sin existencia</span>
    <span><span class="dot" style="background:#1e5a9e"></span>Tu ubicación</span>
  </div>
  <div class="scope" id="scope"></div>
  <div class="results" id="results"></div>

</div>

<footer>Caja de Seguro Social · Dirección Nacional de Logística — Datos al <span id="fecha"></span></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
let D=null, map=null, markers=[], userPos=null, selected=null;

// Vía principal: data.json servido por GitHub Pages (CDN, aguanta tráfico nacional).
// Fallback: endpoint GAS (Web App). Pega aquí la URL .../exec si quieres respaldo en vivo.
const API_URL='';

function norm(s){return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();}
function haversine(a,b,c,d){const R=6371,r=Math.PI/180;const dla=(c-a)*r,dlo=(d-b)*r;const x=Math.sin(dla/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dlo/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}

// 1) data.json del CDN (GitHub Pages). 2) si falla, endpoint GAS por JSONP.
function cargarData(){
  return new Promise((resolve,reject)=>{
    fetch('data.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw 0;return r.json();})
      .then(j=>(j&&j.sku)?resolve(j):viaGAS(resolve,reject))
      .catch(()=>viaGAS(resolve,reject));
  });
}
function viaGAS(resolve,reject){
  if(!API_URL){ return reject(new Error('sin datos')); }
  const cb='__mfd_'+Date.now();
  const sc=document.createElement('script');
  let done=false;
  const to=setTimeout(()=>{ if(!done){done=true;cleanup();reject(new Error('timeout'));} },8000);
  function cleanup(){ clearTimeout(to); delete window[cb]; if(sc.parentNode)sc.parentNode.removeChild(sc); }
  window[cb]=(j)=>{ if(done)return; done=true; cleanup(); (j&&j.sku)?resolve(j):reject(new Error('vacío')); };
  sc.onerror=()=>{ if(!done){done=true;cleanup();reject(new Error('error'));} };
  sc.src=API_URL+(API_URL.indexOf('?')>=0?'&':'?')+'action=getData&callback='+cb;
  document.body.appendChild(sc);
}

cargarData().then(j=>{D=j;boot();})
  .catch(e=>{document.getElementById('results').innerHTML='<div class="empty">No se pudo cargar la información. Intente más tarde.</div>';console.error(e);});

function boot(){
  document.getElementById('fecha').textContent=D.meta.fecha;
  // métricas
  const m=D.meta;
  document.getElementById('metrics').innerHTML=`
    <div class="mcard m-blue"><div class="big num">${m.pct_disp}</div><div class="lbl">de medicamentos disponibles<br>${m.lom_disp} de ${m.lom_total} de la Lista Oficial</div></div>
    <div class="mcard m-white"><div class="big num">${m.n_med}</div><div class="lbl">medicamentos en seguimiento<br>cobertura por unidad ejecutora</div></div>
    <div class="mcard m-amber"><div class="big num">${m.vital_sin}</div><div class="lbl">medicamentos <b>vitales</b><br>requieren reposición</div></div>`;
  // filtros
  const fp=document.getElementById('fProv');D.provincias.forEach(p=>fp.innerHTML+=`<option>${p}</option>`);
  const ft=document.getElementById('fTipo');D.tipos.forEach(t=>ft.innerHTML+=`<option>${t}</option>`);
  fp.onchange=ft.onchange=()=>{if(selected)renderResults();};
  // autocompletar
  const q=document.getElementById('q'),sg=document.getElementById('suggest');
  q.addEventListener('input',()=>{
    const v=norm(q.value);if(v.length<2){sg.style.display='none';return;}
    const hits=D.sku.filter(s=>norm(s.nombre).includes(v)).slice(0,12);
    if(!hits.length){sg.style.display='none';return;}
    sg.innerHTML=hits.map(s=>`<div onclick="pick('${s.cod}')">${s.nombre}<span class="sg-tag">${s.lom==='LOM'?'LOM':'No-LOM'}${s.vital==='VITAL'?' · Vital':''}</span></div>`).join('');
    sg.style.display='block';
  });
  q.addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});
  document.addEventListener('click',e=>{if(!e.target.closest('.searchbox'))sg.style.display='none';});
}

function doSearch(){
  const v=norm(document.getElementById('q').value);
  if(v.length<2)return;
  const hit=D.sku.find(s=>norm(s.nombre)===v)||D.sku.find(s=>norm(s.nombre).includes(v));
  if(hit)pick(hit.cod);
}
function pick(cod){
  selected=D.sku.find(s=>s.cod===cod);
  document.getElementById('q').value=selected.nombre;
  document.getElementById('suggest').style.display='none';
  renderHead();renderResults();
  document.getElementById('medhead').scrollIntoView({behavior:'smooth',block:'start'});
}
function renderHead(){
  const s=selected;
  let tags=`<span class="tag ${s.lom==='LOM'?'t-lom':'t-nolom'}">${s.lom}</span>`;
  if(s.vital==='VITAL')tags+=`<span class="tag t-vital"><i class="ti ti-heart"></i> Vital</span>`;
  if(s.sistema)tags+=`<span class="tag t-cat">${s.sistema}</span>`;
  document.getElementById('medhead').innerHTML=`<div class="medhead"><div class="name">${s.nombre}</div><div class="tags">${tags}</div></div>`;
}

function nivelClass(n){if(n==='ALTA'||n==='ADECUADA')return'nivel-ALTA';if(n==='SEGUIMIENTO'||n==='REDUCIDA')return'nivel-SEGUIMIENTO';if(n==='SIN EXISTENCIA')return'nivel-SINEXISTENCIA';return'nivel-ALTA';}
function estado(f){
  if(f.nivel==='SIN EXISTENCIA'||f.saldo<=0)return['st-bad','ti-circle-x','Sin existencia'];
  if(f.nivel==='REDUCIDA'||f.nivel==='SEGUIMIENTO')return['st-warn','ti-alert-triangle','Cobertura baja'];
  return['st-ok','ti-circle-check','Disponible'];
}

function renderResults(){
  const cod=selected.cod;
  let filas=(D.det[cod]||[]).slice();
  const fp=document.getElementById('fProv').value,ft=document.getElementById('fTipo').value;
  if(fp)filas=filas.filter(f=>f.prov===fp);
  if(ft)filas=filas.filter(f=>f.tipo===ft);
  // distancia
  if(userPos){filas.forEach(f=>f.dist=haversine(userPos[0],userPos[1],f.lat,f.lng));filas.sort((a,b)=>a.dist-b.dist);}
  else filas.sort((a,b)=>b.saldo-a.saldo);

  const conEx=filas.filter(f=>f.saldo>0).length;
  document.getElementById('scope').innerHTML=userPos
    ?`Unidades cercanas a <b style="color:#1e5a9e">tu ubicación</b> · ${conEx} con existencia`
    :`${filas.length} unidades · ${conEx} con existencia · <i>activa tu ubicación para ordenar por cercanía</i>`;

  renderMap(filas);

  const box=document.getElementById('results');
  if(!filas.length){box.innerHTML='<div class="empty">No hay unidades para los filtros seleccionados.</div>';return;}
  box.innerHTML=filas.map(f=>{
    const[cls,icon,txt]=estado(f);
    const dist=f.dist!=null?` · ${f.dist.toFixed(1)} km`:'';
    const tel=f.tel?` · <i class="ti ti-phone"></i> ${f.tel.split(';')[0]}`:'';
    const cob=f.saldo>0&&f.dias<9999?`cobertura ${Math.round(f.dias)} días`:(f.saldo>0?'con stock':'—');
    return `<div class="rcard ${nivelClass(f.nivel)}">
      <div class="info"><div class="nm">${f.nombre}</div>
      <div class="meta"><i class="ti ti-map-pin"></i> ${f.loc||f.prov}${dist}${tel}</div></div>
      <div class="stat"><div class="st ${cls}"><i class="ti ${icon}"></i> ${txt}</div><div class="cv">${cob}</div></div>
    </div>`;
  }).join('');
}

function renderMap(filas){
  document.getElementById('map').style.display='block';
  document.getElementById('legend').style.display='flex';
  if(!map){map=L.map('map',{scrollWheelZoom:false});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);}
  markers.forEach(mk=>map.removeLayer(mk));markers=[];
  const pts=[];
  filas.forEach(f=>{
    if(!f.lat)return;
    const col=f.saldo<=0?'#c0392b':(f.nivel==='REDUCIDA'||f.nivel==='SEGUIMIENTO'?'#d89a1a':'#1d9e75');
    const ic=L.divIcon({className:'',html:`<div style="width:16px;height:16px;border-radius:50%;background:${col};border:3px solid #fff;box-shadow:0 0 4px rgba(0,0,0,.4)"></div>`,iconSize:[16,16],iconAnchor:[8,8]});
    const cob=f.saldo>0&&f.dias<9999?`<br>cobertura ${Math.round(f.dias)} días`:'';
    const mk=L.marker([f.lat,f.lng],{icon:ic}).addTo(map).bindPopup(`<b>${f.nombre}</b><br>${f.loc||f.prov}${cob}${f.tel?'<br><i>'+f.tel.split(';')[0]+'</i>':''}`);
    markers.push(mk);pts.push([f.lat,f.lng]);
  });
  if(userPos){
    const um=L.marker(userPos,{icon:L.divIcon({className:'',html:'<div style="width:16px;height:16px;border-radius:50%;background:#1e5a9e;border:3px solid #fff;box-shadow:0 0 0 5px rgba(30,90,158,.3)"></div>',iconSize:[16,16],iconAnchor:[8,8]})}).addTo(map).bindPopup('Tu ubicación');
    markers.push(um);pts.push(userPos);
  }
  if(pts.length)map.fitBounds(pts,{padding:[30,30],maxZoom:12});
  setTimeout(()=>map.invalidateSize(),200);
}

function useGeo(){
  if(!navigator.geolocation){alert('Tu dispositivo no permite ubicación.');return;}
  navigator.geolocation.getCurrentPosition(p=>{
    userPos=[p.coords.latitude,p.coords.longitude];
    if(selected)renderResults();
    else alert('Ubicación activada. Busca un medicamento para ver las unidades más cercanas.');
  },()=>alert('No se pudo obtener tu ubicación.'));
}
</script>
</body>
</html>
